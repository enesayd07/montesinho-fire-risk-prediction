name: CD - Deploy to Hugging Face

on:
  workflow_run:
    workflows: ["CI - Test Pipeline"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add hf https://huggingface.co/spaces/${{ secrets.HF_SPACE_ID }} || true
          git remote set-url hf https://huggingface.co/spaces/${{ secrets.HF_SPACE_ID }}
          git push https://user:$HF_TOKEN@huggingface.co/spaces/${{ secrets.HF_SPACE_ID }} main --force