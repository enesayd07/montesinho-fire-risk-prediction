name: CT - Manual Retrain

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Retrain reason (optional)"
        required: false
        default: "Scheduled retrain"

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run retrain pipeline
        working-directory: src
        run: python retrain.py

      - name: Commit and push if model updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/
          git diff --cached --quiet || (git commit -m "retrain: model updated (${{ github.event.inputs.reason }})" && git push)